name: Demo video

on:
  push:
    branches: [deck-shots]
    paths-ignore: ['scripts/video/music.mjs', '.github/workflows/music.yml']

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: golos
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/golos
      AUTH_SECRET: deck-shots-secret-0123456789abcdef0123456789
      NEXT_TELEMETRY_DISABLED: '1'
      BLOB_STORE_ID: demo
      DEMO_LOCAL_UPLOADS: '1'
      CAREER_ONLY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: ffmpeg
        timeout-minutes: 6
        run: |
          if ! command -v ffmpeg >/dev/null; then
            curl -fsSL --retry 3 -o /tmp/ff.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz \
              && mkdir -p /tmp/ff && tar -xJf /tmp/ff.tar.xz -C /tmp/ff --strip-components=1 \
              && sudo ln -sf /tmp/ff/bin/ffmpeg /usr/local/bin/ffmpeg \
              || (npm i --no-save ffmpeg-static@5 && sudo ln -sf "$(node -p "require('ffmpeg-static')")" /usr/local/bin/ffmpeg)
          fi
          ffmpeg -version | head -1
      - run: node scripts/migrate.mjs
      - run: node scripts/deck/seed.mjs
      - run: npx next build
      - run: npx playwright install chromium
        timeout-minutes: 6
      - name: Start
        run: |
          npx next start > server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3000/api/health && break; sleep 1; done
      - run: if [ -z "$CAREER_ONLY" ]; then node scripts/video/record.mjs; fi
      - run: node scripts/video/career.mjs
        continue-on-error: true
        timeout-minutes: 5
      - if: always()
        run: tail -n 60 server.log || true
      - name: Commit clips
        if: always()
        run: |
          git config user.name "deck-shots"
          git config user.email "deck-shots@users.noreply.github.com"
          git add video-clips
          git commit -m "Сцены демо-ролика" || echo "нет изменений"
          git push
