name: Demo video

on:
  push:
    branches: [deck-shots]

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: golos
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/golos
      AUTH_SECRET: deck-shots-secret-0123456789abcdef0123456789
      NEXT_TELEMETRY_DISABLED: '1'
      BLOB_STORE_ID: demo
      DEMO_LOCAL_UPLOADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: ffmpeg
        timeout-minutes: 8
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          if ! command -v ffmpeg >/dev/null; then
            for i in 1 2 3; do
              sudo -E apt-get update -qq && sudo -E apt-get install -y -qq --no-install-recommends ffmpeg && break
              sleep 10
            done
          fi
          ffmpeg -version | head -1
      - run: node scripts/migrate.mjs
      - run: node scripts/deck/seed.mjs
      - run: npx next build
      - run: npx playwright install --with-deps chromium
      - name: Start
        run: |
          npx next start > server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3000/api/health && break; sleep 1; done
      - run: node scripts/video/record.mjs
      - if: always()
        run: tail -n 60 server.log || true
      - name: Commit clips
        if: always()
        run: |
          git config user.name "deck-shots"
          git config user.email "deck-shots@users.noreply.github.com"
          git add video-clips
          git commit -m "Сцены демо-ролика" || echo "нет изменений"
          git push
