name: Music

on:
  push:
    branches: [deck-shots]
    paths: ['scripts/video/music.mjs', '.github/workflows/music.yml']

jobs:
  music:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install chromium
        timeout-minutes: 6
      - run: node scripts/video/music.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: music
          path: music/
          retention-days: 3
