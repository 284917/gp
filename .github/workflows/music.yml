name: Music

on:
  push:
    branches: [deck-shots]
    paths: ['scripts/video/music.mjs', '.github/workflows/music.yml']

permissions:
  contents: write

jobs:
  music:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install chromium
        timeout-minutes: 6
      - run: node scripts/video/music.mjs
      - name: Commit music
        run: |
          rm -f music/page.html
          git config user.name "deck-shots"
          git config user.email "deck-shots@users.noreply.github.com"
          git add music
          git commit -m "Музыка-кандидаты для ролика" || echo "нет изменений"
          git pull --rebase -q || true
          git push
